<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,DejaVu Sans,Arial,sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
</defs>
<rect width="1180" height="470" fill="#0b1120"/>
<text x="40" y="52" font-size="26" fill="#e5ecf7" font-weight="700" text-anchor="start">Foundation data — load in this order or chase orphans for weeks</text>
<text x="40" y="80" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">Every module above this layer looks broken when the layer below is empty.</text>
<rect x="40" y="118" width="250" height="108" rx="10" fill="#111c33" stroke="#f97316" stroke-opacity="0.6"/>
<text x="54" y="146" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">1 · Company</text>
<text x="54" y="168" font-size="11.5" fill="#f97316" font-weight="400" text-anchor="start">core_company</text>
<text x="54" y="192" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → no owner of record</text>
<line x1="293" y1="172" x2="317" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320" y="118" width="250" height="108" rx="10" fill="#111c33" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="334" y="146" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">2 · Location</text>
<text x="334" y="168" font-size="11.5" fill="#38bdf8" font-weight="400" text-anchor="start">cmn_location + time zone</text>
<text x="334" y="192" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → SLAs compute against UTC</text>
<line x1="573" y1="172" x2="597" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600" y="118" width="250" height="108" rx="10" fill="#111c33" stroke="#a78bfa" stroke-opacity="0.6"/>
<text x="614" y="146" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">3 · Department</text>
<text x="614" y="168" font-size="11.5" fill="#a78bfa" font-weight="400" text-anchor="start">cmn_department</text>
<text x="614" y="192" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → reports group into (empty)</text>
<line x1="853" y1="172" x2="877" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="880" y="118" width="250" height="108" rx="10" fill="#111c33" stroke="#22d3ee" stroke-opacity="0.6"/>
<text x="894" y="146" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">4 · Cost centre</text>
<text x="894" y="168" font-size="11.5" fill="#22d3ee" font-weight="400" text-anchor="start">cmn_cost_center</text>
<text x="894" y="192" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → no spend allocation</text>
<rect x="40" y="260" width="250" height="108" rx="10" fill="#111c33" stroke="#34d399" stroke-opacity="0.6"/>
<text x="54" y="288" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">5 · Users</text>
<text x="54" y="310" font-size="11.5" fill="#34d399" font-weight="400" text-anchor="start">sys_user + manager</text>
<text x="54" y="334" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → approvals have nowhere to go</text>
<line x1="293" y1="314" x2="317" y2="314" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320" y="260" width="250" height="108" rx="10" fill="#111c33" stroke="#f472b6" stroke-opacity="0.6"/>
<text x="334" y="288" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">6 · Groups</text>
<text x="334" y="310" font-size="11.5" fill="#f472b6" font-weight="400" text-anchor="start">sys_user_group + manager</text>
<text x="334" y="334" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → routing to an orphan queue</text>
<line x1="573" y1="314" x2="597" y2="314" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600" y="260" width="250" height="108" rx="10" fill="#111c33" stroke="#f97316" stroke-opacity="0.6"/>
<text x="614" y="288" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">7 · Schedule</text>
<text x="614" y="310" font-size="11.5" fill="#f97316" font-weight="400" text-anchor="start">business hours</text>
<text x="614" y="334" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → SLA clock is wrong by hours</text>
<line x1="853" y1="314" x2="877" y2="314" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="880" y="260" width="250" height="108" rx="10" fill="#111c33" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="894" y="288" font-size="14" fill="#e5ecf7" font-weight="650" text-anchor="start">8 · Categories</text>
<text x="894" y="310" font-size="11.5" fill="#38bdf8" font-weight="400" text-anchor="start">sys_choice, kept short</text>
<text x="894" y="334" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">skip → unusable reporting</text>
<path d="M 1005 226 V 243 H 165 V 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="40" y="444" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Lab: labs/LAB-04-FOUNDATION-DATA.md · Load 20 real rows, not 2,000 wrong ones.</text>
</svg>